<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#10101c">
    <meta name="description" content="驾驶一艘小小的星际快递船，在流星雨中收集星星、躲避陨石。零依赖、零构建，打开浏览器就能玩的迷你太空躲避游戏。">
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
    <title>星际快递员 · A Tiny Space Delivery Game</title>

    <!-- 搜索引擎与社交分享 -->
    <link rel="canonical" href="https://wulier-arch.github.io/interstellar-courier/">
    <meta property="og:type" content="website">
    <meta property="og:locale" content="zh_CN">
    <meta property="og:site_name" content="星际快递员 · Interstellar Courier">
    <meta property="og:title" content="星际快递员 · Interstellar Courier">
    <meta property="og:description" content="驾驶快递飞船穿过流星雨，收集沿途星星，躲开陨石。一个零依赖、打开浏览器就能玩的迷你太空躲避游戏。">
    <meta property="og:url" content="https://wulier-arch.github.io/interstellar-courier/">
    <meta property="og:image" content="https://wulier-arch.github.io/interstellar-courier/assets/og.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="星际快递员游戏图标：一艘紫色快递飞船、黄色星星与一颗陨石">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="星际快递员 · Interstellar Courier">
    <meta name="twitter:description" content="零依赖、零构建的浏览器迷你太空躲避游戏。">
    <meta name="twitter:image" content="https://wulier-arch.github.io/interstellar-courier/assets/og.png">

    <link rel="stylesheet" href="assets/css/style.css">
  </head>
  <body>
    <main class="game">
      <header class="topline">
        <div>
          <p class="eyebrow">a tiny space delivery game</p>
          <h1>星际快递员</h1>
        </div>
        <div class="stats" aria-label="游戏状态">
          <div class="stat"><span class="stat-label">星星</span><span class="stat-value" id="score">00</span></div>
          <div class="stat"><span class="stat-label">飞船</span><span class="stat-value" id="lives">♥ ♥ ♥</span></div>
          <div class="stat"><span class="stat-label">最高</span><span class="stat-value" id="best">00</span></div>
          <div class="stat"><span class="stat-label">难度</span><span class="stat-value" id="level">1</span></div>
        </div>
      </header>

      <section class="stage" aria-label="星际快递游戏区域">
        <canvas id="game-canvas" aria-label="躲避陨石并收集星星。使用方向键或 WASD 移动。"></canvas>
        <div class="overlay" id="overlay">
          <div class="card">
            <div class="mascot" aria-hidden="true">🛸</div>
            <h2 id="overlay-title">今晚也要准时送达</h2>
            <p id="overlay-copy">驾驶小飞船穿过流星雨，收集沿途的星星。撞到陨石会消耗一艘飞船。</p>
            <dl class="result" id="result" hidden>
              <div class="result-row"><dt>本局星星</dt><dd id="result-score">0 颗</dd></div>
              <div class="result-row"><dt>坚持时间</dt><dd id="result-time">0 秒</dd></div>
              <div class="result-row"><dt>历史最高</dt><dd id="result-best">0 颗</dd></div>
            </dl>
            <p class="record" id="record" hidden>🏆 刷新纪录</p>
            <button class="primary" id="start-button" type="button">开始送快递</button>
          </div>
        </div>
      </section>

      <div class="touch-controls" aria-label="触屏移动控制">
        <button class="touch-button" type="button" data-key="ArrowLeft" aria-label="向左">←</button>
        <button class="touch-button" type="button" data-key="ArrowUp" aria-label="向上">↑</button>
        <button class="touch-button" type="button" data-key="ArrowDown" aria-label="向下">↓</button>
        <button class="touch-button" type="button" data-key="ArrowRight" aria-label="向右">→</button>
      </div>
      <footer class="legend">
        <span>✦ <b>收集星星</b> 加分</span>
        <span>☄ <b>躲开陨石</b> 保住飞船</span>
        <span><b>← ↑ ↓ →</b> / WASD 移动</span>
      </footer>
    </main>

    <script src="assets/js/game-core.js"></script>
    <script src="assets/js/game.js"></script>
  </body>
</html>
