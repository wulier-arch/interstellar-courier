name: 功能建议
description: 提出新玩法、新功能或改进想法
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        欢迎提出建议！请先看看 [CHANGELOG](../../blob/main/CHANGELOG.md) 里的「计划中」，
        也许已经在路上了。

  - type: textarea
    id: problem
    attributes:
      label: 想解决什么问题
      description: 描述你遇到的实际场景，而不只是解决方案。
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 期望的玩法
      description: 如果实现了，游戏里会是什么感觉？
    validations:
      required: true

  - type: dropdown
    id: scope
    attributes:
      label: 改动规模预估
      options:
        - 纯文案 / 数值调整
        - 小改动（单文件、几十行以内）
        - 中等改动（需要重构或新增模块）
    validations:
      required: true

  - type: checkboxes
    id: constraints
    attributes:
      label: 是否守住项目原则
      options:
        - label: 该建议不需要引入任何外部依赖或构建工具
        - label: 该建议不需要加载任何 CDN 资源
